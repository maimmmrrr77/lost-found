<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lost & Found AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/assets/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container"><a class="navbar-brand" href="#">Lost & Found AI</a><div class="ms-auto d-flex gap-2"><button id="btnLogin" class="btn btn-outline-light btn-sm">Đăng nhập</button><button id="btnLogout" class="btn btn-warning btn-sm d-none">Đăng xuất</button></div></div>
</nav>
<header class="hero py-5"><div class="container"><h1>Tìm lại đồ thất lạc thông minh hơn</h1><p class="lead">Đăng tin Lost/Found, tìm kiếm theo mô tả và nhận gợi ý tương đồng từ AI.</p><button id="btnCreate" class="btn btn-primary">Đăng tin mới</button></div></header>
<main class="container py-4">
  <div class="row g-2 mb-4"><div class="col-md-8"><input id="q" class="form-control" placeholder="Tìm điện thoại, ví, giấy tờ..."></div><div class="col-md-2"><select id="type" class="form-select"><option value="">Tất cả</option><option value="LOST">Đồ bị mất</option><option value="FOUND">Đồ nhặt được</option></select></div><div class="col-md-2"><button id="btnSearch" class="btn btn-dark w-100">Tìm kiếm</button></div></div>
  <div id="message"></div><div id="posts" class="row g-3"></div>
</main>

<div class="modal fade" id="loginModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="loginForm"><div class="modal-header"><h5 class="modal-title">Đăng nhập</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input class="form-control mb-2" name="identity" placeholder="Email hoặc username" required><input class="form-control" type="password" name="password" placeholder="Mật khẩu" required></div><div class="modal-footer"><button class="btn btn-primary">Đăng nhập</button></div></form></div></div>

<div class="modal fade" id="postModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="postForm"><div class="modal-header"><h5 class="modal-title">Đăng tin mới</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body row g-3"><div class="col-md-6"><label class="form-label">Loại bài</label><select name="post_type" class="form-select" required><option value="LOST">Tôi làm mất đồ</option><option value="FOUND">Tôi nhặt được đồ</option></select></div><div class="col-md-6"><label class="form-label">Danh mục</label><select name="category_id" id="category" class="form-select" required></select></div><div class="col-12"><label class="form-label">Tiêu đề</label><input name="title" class="form-control" required></div><div class="col-12"><label class="form-label">Mô tả</label><textarea name="description" class="form-control" rows="3" required></textarea></div><div class="col-md-4"><label class="form-label">Màu sắc</label><input name="color" class="form-control"></div><div class="col-md-4"><label class="form-label">Thương hiệu</label><input name="brand" class="form-control"></div><div class="col-md-4"><label class="form-label">Thời gian</label><input name="event_date" type="datetime-local" class="form-control" required></div><div class="col-12"><label class="form-label">Địa điểm</label><input name="location" class="form-control" required></div><div class="col-md-6"><label class="form-label">Liên hệ</label><input name="contact" class="form-control"></div><div class="col-md-6"><label class="form-label">Thưởng (VNĐ)</label><input name="reward" type="number" min="0" class="form-control" value="0"></div></div><div class="modal-footer"><button class="btn btn-primary">Đăng tin</button></div></form></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/frontend/assets/js/app.js"></script>
</body></html>
